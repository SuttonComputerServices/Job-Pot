[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpot"
version = "0.1.0"
description = "Self-hosted job finder: discover, score, auto-apply, track employer replies."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.1,<3",
  "argon2-cffi>=25.1",
  "cryptography>=50",
  "itsdangerous>=2.2",
  "pyotp>=2.10",
  "segno>=1.6",
  "httpx>=0.28,<1",
  "pypdf>=6.21",
  "python-docx>=1.2",
  "playwright>=1.64,<2",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools]
packages = ["jobpot", "jobpot.web", "jobpot.connectors"]

[tool.setuptools.package-data]
jobpot = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
